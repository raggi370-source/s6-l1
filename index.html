<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EpiShop — E-commerce</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">


</head>

<body>

  <header class="bg-primary text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="fs-3 m-0">EpiShop</h1>
      <nav class="d-flex">
        <a class="text-white text-decoration-none mx-2">prodotti</a>
        <a class="text-white text-decoration-none mx-2"> offerte</a>
        <a class="text-white text-decoration-none mx-2 col-lg-3 d-none d-lg-block"> contatti</a>
      </nav>
    </div>
    <!-- Logo a sinistra, link nav a destra. Usa container + d-flex + justify-content-between -->
  </header>

  <section class="bg-light py-5 ">
    <div class=" container text-center ">
      <h2 class=" fs-1 fw-bold mb-3 "> Saldi di primavera</h2>
      <p class="fs-5 text-muted md-4">scopri le offferte sui prodotti in evidenza,fino al 50% di sconto</p>
      <a class="d-inline-block bg-primary text-white text-decoration-none py-2 px-4 rounded ">
        vedi i prodotti</a>
    </div>
    <!-- Hero: titolo grande, sottotitolo, bottone CTA. Usa container + text-center + classi utility -->
  </section>

  <main class="container my-4">
    <div class="row">

      <aside class="col-lg-3 d-none d-lg-block">
        <!-- Sidebar categorie. Visibile solo da lg in su (d-none d-lg-block) -->
        <div class="bg-white p-3 rounded border border-3 ">
          <h3 class=" fs-5 fw-bold mb-3 ">Categorie</h3>
          <P class="m-0 mb-2 ">Scarpe</P>
          <P class="m-0 mb-2 ">T-shirt</P>
          <P class="m-0 mb-2 ">Borse</P>
          <P class="m-0 mb-2 ">Accesori</P>
        </div>
      </aside>

      <section class="col-12 col-lg-9">
        <!-- Griglia prodotti responsive (1 / 2 / 3 / 4 per riga in base al breakpoint) -->
        <h2 class="fs-3-bold mb-4 text-center text-md-start">Prodotti in evidenza</h2>
        <div class="row ">
          <article class="col-12 col-sm-6 col-xl-4 mb-3">
            <div class="border rounded p-3 bg-white shadow-sm">
              <div class="bg-secondary mb-2 rounded" style="height: 160px;"></div>
              <h3 class="fs-5 fw-bold m-0">Nome Prodotto 1</h3>
              <p class="text-muted m-0">€10.00</p>
            </div>
          </article>

          <article class="col-12 col-sm-6 col-xl-4 mb-3">
            <div class="border rounded p-3 bg-white shadow-sm">
              <div class="bg-secondary mb-2 rounded" style="height: 160px;"></div>
              <h3 class="fs-5 fw-bold m-0">Nome Prodotto 2</h3>
              <p class="text-muted m-0">€20.00</p>
            </div>
          </article>

          <article class="col-12 col-sm-6 col-xl-4 mb-3">
            <div class="border rounded p-3 bg-white shadow-sm">
              <div class="bg-secondary mb-2 rounded" style="height: 160px;"></div>
              <h3 class="fs-5 fw-bold m-0">Nome Prodotto 3</h3>
              <p class="text-muted m-0">€30.00</p>
            </div>
          </article>

        </div>
      </section>

    </div>
  </main>

  <footer class="bg-black text-white py-4 mt-5 ">
    <!-- Footer scuro centrato con copyright -->
    <div class="container text-center ">
      <p class="m-0">&copy 2026 Epishop</p>
    </div>
  
  </footer>

</body>

</html>
